<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600&family=Instrument+Serif&display=swap">
  <title>{{title}} — CS Animations</title>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>

  <nav class="nav">
    <a href="../../index.html" class="nav__logo">
      <span>&gt;</span> cs_animations
    </a>
    <ul class="nav__links">
      <li><a href="../../index.html#categories">Browse</a></li>
    </ul>
    <div class="nav__music">
      <button class="nav__music-btn" id="musicToggle" title="Play lofi music">
        <div class="nav__music-bars">
          <span></span><span></span><span></span><span></span>
        </div>
        lofi
      </button>
    </div>
  </nav>

  <section class="category-hero">
    <div class="category-hero__breadcrumb">
      <a href="../../index.html">home</a>
      <span class="sep">/</span>
      <span>{{id}}</span>
    </div>
    <h1 class="category-hero__title">{{title}}</h1>
    <p class="category-hero__desc">
      {{description}}
    </p>
  </section>

  <div class="animations-grid" id="animGrid" data-category="{{id}}"></div>

  <footer class="footer">
    cs_animations — built for learning
  </footer>

  <script src="../../js/categories.js"></script>
  <script src="../../js/category-page.js"></script>
  <script src="../../js/lofi-music.js" defer></script>
</body>
</html>
