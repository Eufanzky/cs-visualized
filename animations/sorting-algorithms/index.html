<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorting Algorithms — CS Animations</title>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>

  <nav class="nav">
    <a href="../../index.html" class="nav__logo">
      <span>&gt;</span> cs_animations
    </a>
    <ul class="nav__links">
      <li><a href="../../index.html#categories">Browse</a></li>
    </ul>
    <div class="nav__music">
      <button class="nav__music-btn" id="musicToggle" title="Play lofi music">
        <div class="nav__music-bars">
          <span></span><span></span><span></span><span></span>
        </div>
        lofi
      </button>
    </div>
  </nav>

  <section class="category-hero">
    <div class="category-hero__breadcrumb">
      <a href="../../index.html">home</a>
      <span class="sep">/</span>
      <span>sorting-algorithms</span>
    </div>
    <h1 class="category-hero__title">Sorting Algorithms</h1>
    <p class="category-hero__desc">
      Watch elements rearrange themselves through comparison, swapping,
      and partitioning strategies. Step through each pass or let it run.
    </p>
  </section>

  <div class="animations-grid" id="animGrid" data-category="sorting-algorithms"></div>

  <footer class="footer">
    cs_animations — built for learning
  </footer>

  <script src="../../js/categories.js"></script>
  <script src="../../js/category-page.js"></script>
  <script src="../../js/lofi-music.js"></script>
  <script>
    document.getElementById('musicToggle').addEventListener('click', function () {
      var on = LofiMusic.toggle();
      this.classList.toggle('is-playing', on);
      this.title = on ? 'Stop lofi music' : 'Play lofi music';
    });
  </script>
</body>
</html>
